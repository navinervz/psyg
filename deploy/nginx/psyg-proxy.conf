# ============================================================================
#  تنظیمات مشترک پراکسی
#  مسیر نصب: /etc/nginx/snippets/psyg-proxy.conf
# ============================================================================

proxy_http_version 1.1;

# نگه داشتن کانکشن باز به اپ — تأخیر کمتر
proxy_set_header Connection        "";

# بدون این هدرها، Next آدرس و پروتکل واقعی را نمی‌داند و ریدایرکت‌ها
# و لینک‌های canonical اشتباه ساخته می‌شوند
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 10s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# اجازه‌ی بافر کردن پاسخ تا کانکشن اپ زودتر آزاد شود
proxy_buffering    on;
proxy_buffer_size  8k;
proxy_buffers      16 8k;
