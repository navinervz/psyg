# ============================================================================
#  Nginx برای PsyG
#
#  جای psygstore.shop را با دامنه‌ی خودتان عوض کنید.
#  مسیر نصب:  /etc/nginx/sites-available/psyg.conf
#  فعال‌سازی:  ln -s /etc/nginx/sites-available/psyg.conf /etc/nginx/sites-enabled/
#
#  ترتیب کار: اول این فایل را با بلوک HTTP (بدون SSL) بگذارید، certbot را
#  اجرا کنید تا گواهی بگیرد و خودش بلوک HTTPS را کامل کند.
# ============================================================================

# محدودیت نرخ برای مسیرهای حساس — جلوی اسپم فرم خبرنامه و ربات‌ها
limit_req_zone $binary_remote_addr zone=psyg_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=psyg_general:10m rate=120r/m;

# اپ Next که روی لوکال‌هاست گوش می‌دهد
upstream psyg_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─────────────────────────  HTTP → HTTPS  ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name psygstore.shop www.psygstore.shop;

    # مسیر تایید certbot باید روی HTTP باز بماند
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://psygstore.shop$request_uri;
    }
}

# ───────────────────  www → بدون www (یکسان‌سازی دامنه)  ───────────────────
# داشتن هر دو نسخه برای گوگل یعنی محتوای تکراری
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.psygstore.shop;

    ssl_certificate     /etc/letsencrypt/live/psygstore.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psygstore.shop/privkey.pem;

    return 301 https://psygstore.shop$request_uri;
}

# ────────────────────────────  سرور اصلی  ────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name psygstore.shop;

    ssl_certificate     /etc/letsencrypt/live/psygstore.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psygstore.shop/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS — عمداً بدون includeSubDomains.
    #
    # اگر includeSubDomains بگذاریم، مرورگر برای *همه‌ی* زیردامنه‌ها
    # (از جمله n8n.psygstore.shop) اجبار HTTPS می‌کند. اگر آنجا مشکلی
    # در گواهی باشد، کاربر با خطای غیرقابل‌عبور روبه‌رو می‌شود.
    #
    # این هدر را مرورگر کش می‌کند و پس گرفتنش سخت است، پس محافظه‌کارانه
    # شروع می‌کنیم. وقتی همه‌ی زیردامنه‌ها گواهی درست داشتند، می‌شود
    # includeSubDomains را اضافه کرد.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # سقف حجم درخواست؛ این سایت آپلود ندارد
    client_max_body_size 1m;

    # فشرده‌سازی
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml font/woff2;

    # اگر ماژول brotli نصب است، خیلی بهتر از gzip فشرده می‌کند
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/json application/javascript image/svg+xml font/woff2;

    access_log /var/log/nginx/psyg.access.log;
    error_log  /var/log/nginx/psyg.error.log warn;

    # ─── فایل‌های ساخته‌شده‌ی Next: نام هش‌دار دارند، پس کش دائمی ───
    location /_next/static/ {
        proxy_pass http://psyg_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── فونت‌ها و تصاویر ───
    location ~* \.(woff2|woff|ttf|otf)$ {
        proxy_pass http://psyg_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
        proxy_pass http://psyg_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ─── فرم خبرنامه: محدودیت نرخ سخت‌گیرانه ───
    location /api/ {
        limit_req zone=psyg_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://psyg_app;
        include /etc/nginx/snippets/psyg-proxy.conf;
    }

    # ─── لینک‌های خروجی افیلیت ───
    location /go/ {
        proxy_pass http://psyg_app;
        include /etc/nginx/snippets/psyg-proxy.conf;

        # ریدایرکت افیلیت هرگز نباید کش شود
        add_header Cache-Control "no-store" always;
    }

    # ─── بقیه‌ی سایت ───
    location / {
        limit_req zone=psyg_general burst=40 nodelay;

        proxy_pass http://psyg_app;
        include /etc/nginx/snippets/psyg-proxy.conf;
    }
}
